# Requests a Codex review once a PR is ready for review and on every push after that.
# Drafts are skipped as a safety net: the Review lane raises the PR already ready, after its own
# pre-Codex review, so none should exist. The project's own merge-after-codex-review workflow
# reacts to the result. Installed by .claude/bin/super-board-codex-bot-install.sh. Needs the
# CODEX_REVIEW_TOKEN secret.
name: Codex Review Trigger

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [__BASE__]

permissions:
  pull-requests: write

jobs:
  comment:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Post @codex review comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "@codex review"
